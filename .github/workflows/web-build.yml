name: Deploy Expo Web to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Export Expo Web
        run: npx expo export --platform web

      - name: Prepare GitHub Pages SPA routing
        run: |
          cat > dist/404.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="robots" content="noindex">
            <title>KILIX</title>
            <script>
              (function () {
                var l = window.location;
                var parts = l.pathname.split('/').filter(Boolean);
                var repoIndex = parts.indexOf('kilixapp_web');
                var route = repoIndex >= 0 ? parts.slice(repoIndex + 1).join('/') : '';
                var base = repoIndex >= 0 ? '/' + parts.slice(0, repoIndex + 1).join('/') : '';
                var query = l.search || '';
                var hash = l.hash || '';

                // GitHub Pages cannot rewrite SPA paths. Send legacy path URLs
                // directly to the hash route so the server only ever receives
                // the real /kilixapp_web/ document.
                var target = base + '/#/' + route;
                if (query) target += query;
                target += hash;
                l.replace(target);
              })();
            </script>
          </head>
          <body></body>
          </html>
          EOF

          # Hash navigation is the canonical web routing mode. No script in
          # index.html rewrites the hash back into a server path.
          test -s dist/index.html
          test -s dist/404.html
          touch dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy to GitHub Pages
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
