name: Deploy Expo Web to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Export Expo Web
        run: npx expo export --platform web

      - name: Make GitHub Pages SPA fallback
        shell: bash
        run: |
          set -euo pipefail

          # GitHub Pages has no server-side SPA rewrites. For every unknown
          # client-side route it serves 404.html. Make that document the
          # exact same app entry point as index.html so React Navigation
          # receives the original URL and resolves the route in the client.
          test -s dist/index.html
          cp dist/index.html dist/404.html

          # Disable Jekyll so Expo assets (including underscore paths) are
          # served exactly as generated.
          touch dist/.nojekyll

          # Fail the build if either entry point is missing/empty.
          test -s dist/index.html
          test -s dist/404.html

          echo "=== Pages artifact root ==="
          ls -la dist
          echo "=== Entry points ==="
          wc -c dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy to GitHub Pages
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
