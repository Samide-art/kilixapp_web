name: Deploy Expo Web to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Export Expo Web
        run: npx expo export --platform web

      - name: Prepare GitHub Pages SPA routing
        run: |
          cat > dist/404.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="robots" content="noindex">
            <title>KILIX</title>
            <script>
              var l = window.location;
              var pathSegmentsToKeep = 1;
              var route = l.pathname.split('/').slice(1 + pathSegmentsToKeep).join('/');
              var base = l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/');
              l.replace(
                l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
                base + '/?/' + route.replace(/&/g, '~and~') +
                (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
                l.hash
              );
            </script>
          </head>
          <body></body>
          </html>
          EOF

          python3 - <<'PY'
          from pathlib import Path
          p = Path("dist/index.html")
          html = p.read_text(encoding="utf-8")
          restore = r'''<script>
          (function () {
            var l = window.location;
            var search = l.search;
            if (!search || search.indexOf("?/") !== 0) return;
            var decoded = search.slice(2).replace(/~and~/g, "&");
            var hashIndex = decoded.indexOf("#");
            var hash = hashIndex >= 0 ? decoded.slice(hashIndex) : l.hash;
            var routeAndQuery = hashIndex >= 0 ? decoded.slice(0, hashIndex) : decoded;
            var queryIndex = routeAndQuery.indexOf("&");
            var route = queryIndex >= 0 ? routeAndQuery.slice(0, queryIndex) : routeAndQuery;
            var query = queryIndex >= 0 ? routeAndQuery.slice(queryIndex + 1) : "";
            var base = l.pathname.replace(/\/$/, "");
            history.replaceState(null, "", base + "/" + route.replace(/^\//, "") + (query ? "?" + query : "") + hash);
          })();
          </script>'''
          if "(function () {" not in html:
              html = html.replace("<script", restore + "\n    <script", 1)
              p.write_text(html, encoding="utf-8")
          PY

          test -s dist/index.html
          test -s dist/404.html
          touch dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy to GitHub Pages
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
